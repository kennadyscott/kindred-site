<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Therapist Portal — Kindred</title>
<meta name="robots" content="noindex">
<!--
  This page used to host a SIMULATED therapist portal: fake localStorage
  accounts and a mock card form that processed nothing ("no payment is
  processed"). Once real accounts existed (Supabase Auth) and real billing went
  live (Stripe), leaving it reachable meant a therapist could complete an entire
  fake signup and believe they had joined. It now redirects to the real product.
-->
<meta http-equiv="refresh" content="0; url=/app/">
<link rel="canonical" href="/app/">
<script>window.location.replace('/app/');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { font-family:'Inter',system-ui,sans-serif; background:#FFF8EF; color:#422448;
         display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:24px; }
  .wrap { text-align:center; max-width:420px; }
  h1 { font-family:'Literata', Georgia, serif; font-size:26px; margin:0 0 10px; }
  p { color:#6b5a70; line-height:1.6; margin:0 0 20px; }
  a { display:inline-block; background:#422448; color:#fff; text-decoration:none;
      padding:13px 22px; border-radius:999px; font-weight:600; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Taking you to Kindred…</h1>
    <p>The therapist portal has moved. If you aren't redirected automatically, use the button below.</p>
    <a href="/app/#match">Go to Kindred</a>
  </div>
</body>
</html>
