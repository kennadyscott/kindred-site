<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindred</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M30 8 C44 8 46 20 46 34 L46 66 C46 82 42 92 30 92 C24 92 22 84 22 66 L22 34 C22 16 24 8 30 8 Z' fill='%23422448'/><path d='M52 34 C52 20 62 10 78 8 C80 22 72 36 56 38 C53.5 38.3 52 37 52 34 Z' fill='%23B8A3C4'/><path d='M52 46 C68 46 78 56 80 72 C66 74 52 66 52 50 Z' fill='%23BE765F'/></svg>">
<script>
/* ===========================================================================
   GitHub Pages serves this file for every path that matches no real file --
   which makes it the router for therapist URLs:

       kindredtherapymatch.com/desirae-tarris

   A single path segment shaped like a slug forwards to the profile page,
   which then puts the pretty path back in the address bar (replaceState in
   profile.js). Real files always win over this file, so /about, /app and
   friends can never be swallowed -- only genuinely-missing paths arrive here.

   ?from=browse (and any other query) is carried through, so the Kindred
   return ribbon survives the pretty URL.

   HONEST LIMIT: Pages serves this with HTTP 404, so crawlers and link
   previews treat pretty URLs as not-found until prerendering (step 5) writes
   a real file per therapist. Humans get the site either way; step 5 makes
   the same URLs first-class and this file becomes the fallback for
   therapists newer than the last build.
   =========================================================================== */
(function () {
  var seg = location.pathname.replace(/^\/+|\/+$/g, '');
  var isSlug = /^[a-z0-9][a-z0-9-]{1,80}$/.test(seg) && seg.indexOf('.') === -1 && seg.indexOf('/') === -1;
  if (isSlug) {
    var qs = location.search ? location.search.replace(/^\?/, '&') : '';
    location.replace('/profile.html?t=' + encodeURIComponent(seg) + qs);
  }
})();
</script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#FAF4EC;color:#3A2C40;
     font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
     font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
.state{max-width:560px;margin:16vh auto 0;padding:0 22px;text-align:center}
.state h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(1.7rem,4vw,2.3rem);
          margin:0 0 .6rem;line-height:1.2}
.state p{color:#77687D;margin:0 0 1.4rem}
.btn{display:inline-block;background:#A85B44;color:#FFF8F2;text-decoration:none;
     font-weight:700;font-size:.95rem;padding:.85em 1.7em;border-radius:999px;margin:0 6px 8px}
.btn.ghost{background:transparent;color:#A85B44;border:1.5px solid #A85B44}
</style>
</head>
<body>
<div class="state">
  <h1>That page isn't here.</h1>
  <p>The link may be out of date &mdash; or a therapist's page may have moved on.</p>
  <a class="btn" href="/">Kindred home</a>
  <a class="btn ghost" href="/app/#match">Find a Therapist</a>
</div>
</body>
</html>
