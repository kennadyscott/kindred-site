<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindred HQ</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M30 8 C44 8 46 20 46 34 L46 66 C46 82 42 92 30 92 C24 92 22 84 22 66 L22 34 C22 16 24 8 30 8 Z' fill='%23422448'/><path d='M52 34 C52 20 62 10 78 8 C80 22 72 36 56 38 C53.5 38.3 52 37 52 34 Z' fill='%23B8A3C4'/><path d='M52 46 C68 46 78 56 80 72 C66 74 52 66 52 50 Z' fill='%23BE765F'/></svg>">
<style id="lockcss">
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center;
         background: #422448; color: #EFE7EA; -webkit-font-smoothing: antialiased; }
  .lock { width: min(400px, 92vw); text-align: center; padding: 2rem 0; }
  .mark { width: 52px; height: 52px; margin: 0 auto 1rem; }
  h1 { font-family: 'Literata', Georgia, serif; font-weight: 500; font-size: 1.9rem; color: #FAF9FC; }
  .tag { font-size: .64rem; letter-spacing: .18em; text-transform: uppercase; color: #BE765F; margin-top: .4rem; font-weight: 700; }
  form { margin-top: 1.8rem; display: grid; gap: .7rem; }
  input { font: inherit; font-size: 1rem; padding: .85rem 1.1rem; border-radius: 14px; border: 1.5px solid rgba(250,249,252,.25);
          background: rgba(250,249,252,.08); color: #FAF9FC; text-align: center; outline: none; transition: border-color .15s; }
  input::placeholder { color: rgba(239,231,234,.45); }
  input:focus { border-color: #B8A3C4; }
  button { font: inherit; font-weight: 600; font-size: .95rem; padding: .85rem; border-radius: 999px; border: none; cursor: pointer;
           background: #FAF9FC; color: #422448; transition: transform .14s; }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: .55; cursor: wait; transform: none; }
  label.rem { display: flex; align-items: center; justify-content: center; gap: .5rem; font-size: .8rem; color: rgba(239,231,234,.75); cursor: pointer; }
  label.rem input { accent-color: #B8A3C4; width: 15px; height: 15px; }
  .err { font-size: .84rem; font-weight: 600; color: #E8C687; min-height: 1.3em; line-height: 1.4; }
  .fine { margin-top: 1.6rem; font-size: .72rem; color: rgba(239,231,234,.55); line-height: 1.6; }
</style>
</head>
<body>
<div class="lock" id="lock">
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M30 8 C44 8 46 20 46 34 L46 66 C46 82 42 92 30 92 C24 92 22 84 22 66 L22 34 C22 16 24 8 30 8 Z" fill="#FAF9FC"/>
    <path d="M52 34 C52 20 62 10 78 8 C80 22 72 36 56 38 C53.5 38.3 52 37 52 34 Z" fill="#B8A3C4"/>
    <path d="M52 46 C68 46 78 56 80 72 C66 74 52 66 52 50 Z" fill="#BE765F"/>
  </svg>
  <h1>Kindred HQ</h1>
  <p class="tag">Therapy, matched to you</p>
  <form id="f">
    <input type="email" id="em" placeholder="Your email" autocomplete="username" autofocus>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
    <p class="err" id="err"></p>
    <button type="submit" id="go">Sign in</button>
    <label class="rem"><input type="checkbox" id="rem" checked> Keep me signed in on this device</label>
  </form>
  <p class="fine">Your own account — the same one you use across Kindred. Nothing here is
    shared, and access can be removed for one person without changing anything for the other.</p>
</div>
<script src="supabase.js"></script>
<script>
(async () => {
  const URL_ = "https://izukppxgoerqtustfbnk.supabase.co", ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6dWtwcHhnb2VycXR1c3RmYm5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NTAzMTYsImV4cCI6MjEwMDQyNjMxNn0.FeJFOu4PmOJAbk2OqfMH1sQX6DlynKmTyhc-dtKfvZk";
  const err = document.getElementById('err');
  const client = window.supabase.createClient(URL_, ANON, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: 'khq-auth' }
  });

  /* The app never sits on a public URL. Signing in earns a 60-second signed
     link to it; the bucket policy refuses to issue one to anyone outside
     hq_members, so a valid Kindred account is not by itself a way in. */
  async function loadApp(token) {
    const r = await fetch(URL_ + '/storage/v1/object/sign/hq-app/app.json', {
      method: 'POST',
      headers: { apikey: ANON, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ expiresIn: 60 })
    });
    if (r.status === 400 || r.status === 403 || r.status === 404) return { denied: true };
    if (!r.ok) return null;
    const j = await r.json().catch(() => null);
    const rel = j && (j.signedURL || j.signedUrl);
    if (!rel) return null;
    /* storage returns this relative in some versions, absolute in others */
    const href = /^https?:/.test(rel) ? rel : URL_ + '/storage/v1' + (rel[0] === '/' ? '' : '/') + rel;
    const app = await fetch(href).then(x => x.json()).catch(() => null);
    /* never hand boot() something half-formed: it replaces the whole page, so
       a truncated or unexpected response would blank the screen with no clue */
    if (!app || typeof app.js !== 'string' || typeof app.html !== 'string' || typeof app.css !== 'string') return null;
    return { app };
  }

  function boot(p) {
    document.getElementById('lock').remove();
    const lc = document.getElementById('lockcss'); if (lc) lc.remove();
    document.body.style.cssText = '';
    const st = document.createElement('style'); st.textContent = p.css; document.head.appendChild(st);
    document.body.innerHTML = p.html;
    const sc = document.createElement('script'); sc.textContent = p.js; document.body.appendChild(sc);
  }

  /* already signed in on this device */
  const { data } = await client.auth.getSession();
  if (data && data.session) {
    const got = await loadApp(data.session.access_token);
    if (got && got.app) { boot(got.app); return; }
    if (got && got.denied) err.textContent = 'That account does not have access to HQ.';
  }

  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('go');
    btn.disabled = true; btn.textContent = 'Signing in…'; err.textContent = '';
    const { data: d, error } = await client.auth.signInWithPassword({
      email: document.getElementById('em').value.trim(),
      password: document.getElementById('pw').value
    });
    if (error || !d.session) {
      err.textContent = 'That email and password don’t match.';
      btn.disabled = false; btn.textContent = 'Sign in';
      return;
    }
    if (!document.getElementById('rem').checked) {
      /* session should die with the tab */
      window.addEventListener('pagehide', () => { try { localStorage.removeItem('khq-auth'); } catch (e) {} });
    }
    const got = await loadApp(d.session.access_token);
    if (got && got.app) { boot(got.app); return; }
    err.textContent = got && got.denied
      ? 'Signed in, but this account isn’t on the HQ member list.'
      : 'Signed in, but HQ didn’t load. Check your connection and try again.';
    btn.disabled = false; btn.textContent = 'Sign in';
  });
})();
</script>
</body>
</html>
